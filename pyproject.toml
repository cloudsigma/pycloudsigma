[tool.poetry]
name = "cloudsigma"
version = "3.0.0rc1"
description = "CloudSigma's official python library."
authors = ["CloudSigma AG <dev-support@cloudsigma.com>"]
keywords = ["cloud", "cloudsigma", "api", "cloud", "computing"]
classifiers = ["Programming Language :: Python", "Development Status :: 5 - Production/Stable", "Intended Audience :: System Administrators", "Intended Audience :: Developers"]
homepage = "https://github.com/cloudsigma/pycloudsigma"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
"backports.ssl-match-hostname" = {version = ">=3.4.0.2", python = "<3.5"}
configobj = ">=5.0.6"
future = ">=0.18.2"
iso8601 = ">=0.1.12"
pyserial = ">=3.4"
requests = ">=2.23"
simplejson = ">=3.17.0"
six = ">=1.14.0"
websocket-client = ">=0.57.0"
nose = ">=1.3.7"

[tool.poetry.dev-dependencies]
fabric = "3.2.3"
# Exact pending development dependency updates; not SDK runtime requirements.
requests = "2.33.0"
pynacl = "1.6.2"
cryptography = "50.0.0"
cffi = "2.1.1"

[build-system]
requires = ["setuptools==75.3.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
